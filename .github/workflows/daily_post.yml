name: Daily Tistory Auto Post

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 기능 지원

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Auto Blogger
        env:
          TISTORY_ACCESS_TOKEN: ${{ secrets.TISTORY_ACCESS_TOKEN }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TISTORY_CATEGORY_ID: ${{ secrets.TISTORY_CATEGORY_ID }}
          TISTORY_VISIBILITY: ${{ secrets.TISTORY_VISIBILITY }}
        run: python main.py
