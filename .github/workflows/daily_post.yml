name: Daily Tistory Auto Post (Playwright)

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 기능 지원

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run Auto Blogger (Browser Automation)
        env:
          TISTORY_LOGIN_ID: ${{ secrets.TISTORY_LOGIN_ID }}
          TISTORY_LOGIN_PW: ${{ secrets.TISTORY_LOGIN_PW }}
          TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEADLESS: "True"
        run: python main.py
